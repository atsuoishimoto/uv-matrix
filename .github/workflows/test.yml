name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: uv-matrix (Python 3.10–3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # uv-matrix delegates interpreter management to uv; pre-install every
      # supported version so `uv run --python X` finds them.
      - name: Install Python 3.10–3.14
        run: uv python install 3.10 3.11 3.12 3.13 3.14

      # Dogfood: expand the `test` matrix from pyproject.toml and run
      # `uv run --python <ver> pytest -q` for 3.10 through 3.14.
      - name: Run test matrix
        run: uv run uv-matrix run --matrix test

  test-windows:
    name: uv-matrix (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      # Runs the full suite on Windows, including the win32-only end-to-end
      # quoting tests (skipped on other platforms) that exercise the real
      # uv -> cmd.exe -> python chain without mocks.
      - name: Run tests
        run: uv run pytest -q
