name: Release distributions

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fail unless run from a tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::This workflow must be run from a release tag, not a branch." >&2
          exit 1

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Verify the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Build distributions
        run: |
          set -euo pipefail
          rm -rf dist
          uv build
          echo "----- artifacts -----"
          ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create checksum
        run: |
          set -euo pipefail
          cd dist && sha256sum * > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

